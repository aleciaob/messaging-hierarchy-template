<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 556" width="1000" height="556" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Messaging hierarchy tier map</title>
<desc id="d">Fifteen tiers in three layers: A Foundation (tiers 1 to 6), B The case (tiers 7 to 11), C Applied messaging (tiers 12 to 15). Layer D, claim rules, applies to every tier.</desc>
<rect x="0.5" y="0.5" width="999" height="555" rx="12" fill="#FFFFFF" stroke="#D0D7DE"/>
<text x="30" y="42" font-size="21" font-weight="700" fill="#1F2933">Messaging hierarchy: 15 tiers in four layers</text>
<text x="30" y="64" font-size="13" fill="#52606D">Reading order, top to bottom. Build order is different: see docs/pressure-tests-and-build-order.md</text>
<rect x="30" y="84" width="770" height="130" rx="10" fill="#EAF2FB" stroke="#2B6CB0" stroke-width="1.5"/>
<text x="46" y="124" font-size="30" font-weight="700" fill="#2B6CB0">A</text>
<text x="46" y="150" font-size="15" font-weight="700" fill="#1F2933">Foundation</text>
<text x="46" y="170" font-size="12" fill="#52606D">The problem, the</text>
<text x="46" y="186" font-size="12" fill="#52606D">label and the limits</text>
<rect x="196" y="100" width="186" height="44" rx="8" fill="#FFFFFF" stroke="#2B6CB0" stroke-width="1.2"/>
