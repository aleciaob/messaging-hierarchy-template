<text x="46" y="434" font-size="15" font-weight="700" fill="#1F2933">Applied messaging</text>
<text x="46" y="454" font-size="12" fill="#52606D">The case, adapted to</text>
<text x="46" y="470" font-size="12" fill="#52606D">segments and roles</text>
<rect x="196" y="384" width="186" height="44" rx="8" fill="#FFFFFF" stroke="#B7791F" stroke-width="1.2"/>
