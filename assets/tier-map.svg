<rect x="602" y="242" width="186" height="44" rx="8" fill="#FFFFFF" stroke="#2F855A" stroke-width="1.2"/>
<text x="614" y="269" font-size="13" fill="#1F2933"><tspan font-weight="700">9</tspan><tspan dx="8">Alternatives map</tspan></text>
