<rect x="602" y="154" width="186" height="44" rx="8" fill="#FFFFFF" stroke="#2B6CB0" stroke-width="1.2"/>
<text x="614" y="181" font-size="13" fill="#1F2933"><tspan font-weight="700">6</tspan><tspan dx="8">Category sanity check</tspan></text>
<rect x="30" y="226" width="770" height="130" rx="10" fill="#EAF7F0" stroke="#2F855A" stroke-width="1.5"/>
<text x="46" y="266" font-size="30" font-weight="700" fill="#2F855A">B</text>
<text x="46" y="292" font-size="15" font-weight="700" fill="#1F2933">The case</text>
<text x="46" y="312" font-size="12" fill="#52606D">Why a buyer should</text>
<text x="46" y="328" font-size="12" fill="#52606D">believe and choose</text>
<rect x="196" y="242" width="186" height="44" rx="8" fill="#FFFFFF" stroke="#2F855A" stroke-width="1.2"/>
<text x="208" y="269" font-size="13" fill="#1F2933"><tspan font-weight="700">7</tspan><tspan dx="8">Benefit pillars</tspan></text>
