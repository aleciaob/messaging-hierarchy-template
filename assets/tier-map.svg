<text x="411" y="411" font-size="13" fill="#1F2933"><tspan font-weight="700">13</tspan><tspan dx="8">Buyer-role messaging</tspan></text>
<rect x="602" y="384" width="186" height="44" rx="8" fill="#FFFFFF" stroke="#B7791F" stroke-width="1.2"/>
<text x="614" y="411" font-size="13" fill="#1F2933"><tspan font-weight="700">14</tspan><tspan dx="8">Proof library</tspan></text>
<rect x="196" y="438" width="186" height="44" rx="8" fill="#FFFFFF" stroke="#B7791F" stroke-width="1.2"/>
<text x="208" y="465" font-size="13" fill="#1F2933"><tspan font-weight="700">15</tspan><tspan dx="8">Objection responses</tspan></text>
<rect x="816" y="84" width="154" height="414" rx="10" fill="#F1EAFB" stroke="#6B46C1" stroke-width="1.5"/>
<text x="832" y="124" font-size="30" font-weight="700" fill="#6B46C1">D</text>
<text x="832" y="150" font-size="15" font-weight="700" fill="#1F2933">Claim rules</text>
<text x="832" y="174" font-size="12" fill="#52606D">Apply to every tier.</text>
<text x="832" y="192" font-size="12" fill="#52606D">13 rules, each with</text>
<text x="832" y="210" font-size="12" fill="#52606D">a fictional example.</text>
<text x="832" y="246" font-size="12" fill="#52606D">Set them early,</text>
<text x="832" y="264" font-size="12" fill="#52606D">before the pillars.</text>
<line x1="800" y1="149.0" x2="816" y2="149.0" stroke="#6B46C1" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="800" y1="291.0" x2="816" y2="291.0" stroke="#6B46C1" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="800" y1="433.0" x2="816" y2="433.0" stroke="#6B46C1" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="30" y="532" font-size="12" fill="#52606D">Each tier has a placeholder, a prompt and a test. See template/hierarchy-template.md</text>
