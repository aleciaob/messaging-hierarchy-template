<text x="614" y="127" font-size="13" fill="#1F2933"><tspan font-weight="700">3</tspan><tspan dx="8">Positioning statement</tspan></text>
<rect x="196" y="154" width="186" height="44" rx="8" fill="#FFFFFF" stroke="#2B6CB0" stroke-width="1.2"/>
<text x="208" y="181" font-size="13" fill="#1F2933"><tspan font-weight="700">4</tspan><tspan dx="8">Boundaries</tspan></text>
<rect x="399" y="154" width="186" height="44" rx="8" fill="#FFFFFF" stroke="#2B6CB0" stroke-width="1.2"/>
